<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b6b3a">
  <title>Becklan BMS V11</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <img
      id="appIcon"
      class="app-icon"
      src="icons/becklan-icon-512.png"
      alt="Open Becklan BMS"
      tabindex="0"
      role="button"
    >

    <h1>Becklan BMS V11 Professional</h1>
    <p>Click the Becklan logo or the button below to open the management system.</p>

    <button id="openApp" type="button">
      Open Becklan BMS
    </button>

    <p id="status" class="status"></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
